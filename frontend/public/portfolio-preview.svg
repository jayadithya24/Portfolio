<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#071026" />
      <stop offset="1" stop-color="#042033" />
    </linearGradient>
    <style>
      .bg { fill: url(#g); }
      .name { fill: #ffffff; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-weight: 700; font-size: 56px; }
      .role { fill: #9bd1d9; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; font-weight: 600; font-size: 28px; }
      .icons { fill: #cfeef7; font-size: 20px; font-weight: 600; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="630" rx="8" />

  <!-- Name -->
  <text x="80" y="220" class="name">Jayadithya G Salian</text>
  <text x="80" y="270" class="role">Full Stack Developer</text>

  <!-- Tech icons as labeled chips -->
  <g transform="translate(80,330)">
    <rect x="0" y="0" width="160" height="40" rx="8" fill="#0ea5a4" opacity="0.12" />
    <text x="20" y="26" class="icons">⚛️ React</text>

    <rect x="180" y="0" width="190" height="40" rx="8" fill="#7dd3fc" opacity="0.06" />
    <text x="200" y="26" class="icons">☕ Spring Boot / Java</text>

    <rect x="390" y="0" width="120" height="40" rx="8" fill="#60a5fa" opacity="0.06" />
    <text x="410" y="26" class="icons">☁️ Cloud</text>
  </g>

  <!-- Small watermark / domain -->
  <text x="980" y="590" fill="#164e63" font-size="16">portfolio-mu-five-29.vercel.app</text>
</svg>
